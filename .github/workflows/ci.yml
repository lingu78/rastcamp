name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install osmium-tool (data pipeline end-to-end test)
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & component tests
        run: npm run test:ci
        env:
          REQUIRE_OSMIUM: 1

      - name: Expo doctor
        run: npx --yes expo-doctor@latest

      - name: Bundle smoke test (Android + iOS JS bundles)
        run: npx expo export --platform android --platform ios --output-dir dist
        env:
          EXPO_NO_TELEMETRY: 1
